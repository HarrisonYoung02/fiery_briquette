<!doctype html>
<html>
  <head>
    <style>
      #page-title {
        text-align: center;
        font-size: 5em;
      }
      .temp-display {
        display: flex;
        justify-content: center;
        padding: 1em;
      }
      .temp-box {
        display: inline;
        text-align: center;
        font-size: 3em;
        font-weight: bold;
        color: white;
        background: indianred;
        border: 0.15em solid black;
        border-radius: 0.75em;
        padding: 0.5em;
        text-shadow: 2px 2px 2px black;
      }
    </style>
  </head>
  <body>
    <h1 id="page-title">Fiery Briquette</h1>
    <div class="temp-display">
      <div class="temp-box">0 &#8457; | 0 &#8451;</div>
    </div>

    <div>Low Limit: 0&#8457;</div>
    <div>High Limit: 100&#8457;</div>

    <button onclick="setLow()">Set Low</button>
    <button onclick="setHigh()">Set High</button>
    <script>
      function setLow() {
        const temp = prompt("Enter low temperature limit:");

        if (temp !== null && temp.trim() !== "") {
          if (isNaN(parseFloat(temp))) {
            alert("Please enter the limit as a number.");
            return;
          }
          fetch("/setTemp/low?temp=" + encodeURIComponent(temp));
        }
      }
      function setHigh() {
        const temp = prompt("Enter high temperature limit:");

        if (temp !== null && temp.trim() !== "") {
          if (isNaN(parseFloat(temp))) {
            alert("Please enter the limit as a number.");
            return;
          }
          fetch("/setTemp/high?temp=" + encodeURIComponent(temp));
        }
      }
    </script>
  </body>
</html>
